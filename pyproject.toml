[project]
name = "llm-finetuning-on-mac"
version = "0.2.0"
description = "Fine-tune small LLMs on a Mac (Apple Silicon): one folder per lesson of the KGP Talkie series"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.10",
    "datasets>=4.0",
    "huggingface-hub>=2.2.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "mlx-lm>=0.32.0",
    "peft>=0.21.2",
    "pypdf>=6.0",
    "torch>=2.14.1",
    "transformers>=5.20.0",
    "trl>=1.16.0",
]
